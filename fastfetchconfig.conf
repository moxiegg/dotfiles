# Fastfetch config equivalent to your Neofetch setup

# UI appearance
logo = "arch_small"
logoStyle = {
    ascii = true,
    colors = [6, 14],
    bold = true
}
separator = " "

# Image backend setup
image.backend = "kitty"
image.source = "~/.config/neofetch/fern.png"
image.size = "30%"
image.crop = "normal"
image.cropOffset = "northwest"
image.gap = 3
image.xOffset = 3
image.yOffset = 0

# Display modules (translated from your print_info())
modules = [
    { type = "title" },
    { type = "separator" },
    { type = "os", key = "" },
    { type = "kernel", key = "" },
    { type = "shell", key = "" },
    { type = "terminal", key = "" },
    { type = "terminalFont", key = "" },
    { type = "wm", key = "⊞" },
    { type = "theme", key = "" },
    { type = "colors" }
]

# Optional formatting tweaks
os.arch = false
shell.version = true
kernel.shorthand = true
terminalFont.show = true

# Bar display (disabled to match your neofetch style)
cpu.display = "off"
memory.display = "off"
disk.display = "off"
battery.display = "off"

# Colors
colors = {
    title = 4,
    at = 6,
    underline = 1,
    subtitle = 8,
    colon = 8,
    info = 6
}
underline = true
bold = false
underlineChar = " ̶"
